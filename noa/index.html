<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Noa 寵物機｜黑曜石堡壘</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: playful, cozy handheld toy
   IDEA: the frosted translucent badge itself, sitting on a desk at dusk
   PICTURE: the device, large, with live screen and three side buttons
   COLOUR and TYPE: dusk plum ground, ice blue + ember orange from Noa; Noto Sans TC
   LAYOUT: device centre, short controls column beside it, stacks under 720px */
:root{color-scheme:light dark;--bg:light-dark(#efe8f1,#17111c);--ink:light-dark(#241a2b,#efe6f3);--mute:light-dark(#6d5f76,#a897b3);--ice:#6fb7ff;--fire:#ff8a3d;--panel:light-dark(#fff,#221a29);--line:light-dark(#dccfe3,#3a2d44)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
main{max-width:1000px;margin:auto;padding:clamp(20px,4vw,48px) max(4vw,14px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
h1{font-size:clamp(28px,4vw,40px);line-height:1.05;margin:0 0 8px;text-wrap:balance}
.dev{position:relative;padding:26px 22px 34px;border-radius:30px;background:linear-gradient(160deg,light-dark(#ffffffcc,#ffffff22),light-dark(#e6dcebaa,#ffffff0d));box-shadow:inset 0 0 0 1.5px light-dark(#ffffffee,#ffffff30),0 30px 60px -20px #0006;backdrop-filter:blur(6px)}
.dev::before{content:"";position:absolute;inset:12px;border-radius:22px;background:repeating-linear-gradient(90deg,transparent 0 23px,light-dark(#b9a8c522,#ffffff08) 23px 24px);pointer-events:none}
.scr{position:relative;display:block;width:min(72vw,300px);aspect-ratio:3/4;border-radius:6px;background:#000;box-shadow:0 0 0 6px #0b080e,0 0 0 7px light-dark(#cbbdd3,#3b3046);image-rendering:pixelated}
.btns{position:absolute;right:-22px;top:70px;display:grid;gap:12px}
.btns button{width:44px;height:52px;border:0;border-radius:0 12px 12px 0;background:linear-gradient(90deg,light-dark(#cfc3d6,#3a2f44),light-dark(#f3edf6,#5a4b66));color:var(--ink);font:700 13px "Noto Sans TC";cursor:pointer;box-shadow:2px 3px 0 #0003;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.btns button:active,.btns button.on{transform:translateX(-3px);filter:brightness(.9)}
.btns button{position:relative}.btns #bO::after{content:"";position:absolute;left:6px;bottom:5px;height:4px;width:calc((100% - 12px)*var(--p,0));background:#6fb7ff;border-radius:2px}
.btns button:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
.home{display:inline-flex;align-items:center;min-height:44px;color:var(--mute);text-decoration:none;font-size:15px}.home:hover{color:var(--ink)}
.side p{margin:0 0 14px;color:var(--mute);max-width:46ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
.card h2{font-size:16px;margin:0 0 10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button,.reset{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:15px "Noto Sans TC";cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.reset{margin-top:12px;color:#d9534f;border-color:currentColor}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:15px}dt{font-weight:700}dd{margin:0;color:var(--mute)}
small{display:block;margin-top:14px;color:var(--mute);font-size:13px}
.st{width:100%;border-collapse:collapse;font-size:14px}.st td{padding:3px 0}.st td:first-child{width:5.5em;white-space:nowrap}.st td:last-child{width:4.5em;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.st .b{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.st .b i{display:block;height:100%}
@media(max-width:720px){main{grid-template-columns:minmax(0,1fr);justify-items:center}.side{width:100%}}
@media(prefers-reduced-motion:reduce){.btns button{transition:none}}
</style></head><body>
<main>
<div class="dev">
<canvas class="scr" id="scr" width="240" height="320" aria-label="Noa 寵物機畫面"></canvas>
<div class="btns"><button id="bU" aria-label="上">上</button><button id="bO" aria-label="確認">OK</button><button id="bD" aria-label="下">下</button></div>
</div>
<div class="side">
<a class="home" href="/">← 回到黑曜石堡壘</a>
<h1>Noa 寵物機</h1>
<p>你找到 Noa 的小窩了。冰火雙屬性的小龍 Noa 住在這裡，幫它餵食、洗澡、摸摸頭，記得讓冰和火的魔力保持平衡。照顧得好，Rinya 也會來看它。</p>
<div class="card"><h2>時間速度</h2><div class="seg" id="spd"><button data-s="1">真實時間</button><button data-s="60">1 分鐘＝1 小時</button><button data-s="600">6 秒＝1 小時</button></div></div>
<div class="card"><h2>音效</h2><div class="seg"><button id="mute" aria-pressed="false">音效開啟</button></div></div>
<div class="card"><h2>動作預覽</h2><div class="seg"><select id="pv" aria-label="選擇動作" style="min-height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:15px 'Noto Sans TC';padding:0 10px;flex:1"></select><button id="pvb">播放</button></div></div>
<div class="card"><h2>即時數值</h2><table class="st"><tbody id="stat"></tbody></table></div>
<div class="card"><h2>操作</h2><dl><dt>上／下</dt><dd>切換選單（鍵盤 ↑ ↓）</dd><dt>OK</dt><dd>執行（Enter 或空白鍵）</dd><dt>長按 OK</dt><dd>打開／關閉狀態頁</dd></dl>
<button class="reset" id="rst">重新開始（從蛋孵化）</button>
<small>Noa 的進度存在你這台裝置的瀏覽器裡。這是 FoloToy AI Passport 寵物機的網頁版。</small></div>
</div>
</main>
<script>
{
// Noa 素材表（R2）；換新素材表時只要改這一行
const SHEET="https://img.obsidianfirelight.com/commissions/noa-sheet31-20261126-212107.png";
const R={idle:0,blink:1,walk:2,sleep:3,eat:4,jump:5,angry:6,love:7,ice:8,fire:9,hatch:10,hungry:11,sick:12,bath:13,pet:14,over:15,miss:16,rinya:17,ball:18,walkL:19,blinkL:20,stretch:21,smoke:22,icesc:23,idleL:24,hoard:25,chase:26,roll:27,fly:28,yawn:29,note:30};
const YOFF={29:-2,21:-2,22:-2,23:-2,24:-2,25:-2,26:-2,27:1,28:-2};const LEFT=new Set(['walkL','blinkL','idleL','chase','roll','fly']);
const PLAYS=[['ball',3,'玩球'],['chase',3,'追光點'],['hoard',3,'囤寶物'],['roll',3,'打滾'],['fly',2,'練習飛行'],['icesc',3,'做冰雕'],['smoke',3,'吐煙圈']];let lastPlay='';
const MENU=[["feed","餵食"],["pet","摸頭"],["ball","玩耍"],["bath","洗澡"],["ice","藍色吐息"],["fire","噴火"],["sleep","睡覺"],["more","更多"]];
const cv=document.getElementById('scr'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
const img=new Image();let imgErr=false;img.onerror=()=>{imgErr=true};img.src=SHEET;
const H=3600e3,DAY=24*H,KEY='noa-proto-v1';
let missReal=0,floats=[],AC=null,muted=false,breathWarn={},catching=false,S,speed=60,sel=0,anim=null,frame=0,ft=0,statusOpen=false,toast=null,walkX=0,walkDir=1,facing='R',idleMode='idle',idleT=0,last=performance.now();
function fresh(){return{t:Date.now(),phase:'egg',food:80,clean:90,mood:70,health:100,ice:20,fire:20,bond:0,neglect:0,lastVisit:Date.now(),born:Date.now(),runs:0,petCalm:0,over:false,asleep:false,manualSleep:false,wakeUntil:0}}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.phase){if(j.phase==='hatching')j.phase='egg';return j}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load();
const cl=v=>Math.max(0,Math.min(100,v));
function hourOf(t){return new Date(t).getHours()}
function night(t){const h=hourOf(t);return h>=23||h<7}
// advance simulation by ms of game time, in 1-minute steps
function tick(ms){
 while(ms>0){const st=Math.min(ms,60e3);ms-=st;S.t+=st;
  if(S.phase!=='live')continue;
  if(S.manualSleep&&((!night(S.t)&&night(S.t-st))||(!night(S.t)&&S.t-(S.sleepStart||0)>3*H))){S.manualSleep=false;if(!night(S.t))say('Noa 睡飽醒來了')}
  const h=st/H,sl=!S.over&&((night(S.t)&&!(S.wakeUntil>S.t))||S.manualSleep);if(S.asleep&&!sl&&!catching&&!anim&&S.phase==='live'&&S.health>=40&&!S.over)play('stretch',1,'Noa 伸了個懶腰');
  if(!S.asleep&&sl&&!S.manualSleep&&!catching&&!anim&&S.phase==='live')play('yawn',2,'Noa 想睡了');S.asleep=sl;const k=sl?.5:1;
  S.food=cl(S.food-6*h*k);S.clean=cl(S.clean-4*h*k);
  const miss=S.bond>=50&&S.t-S.lastVisit>1.5*DAY;
  S.mood=cl(S.mood-(miss?8:5)*h*k);
  if(!sl){S.ice=Math.min(100,S.ice+4*h);S.fire=Math.min(100,S.fire+4*h)}
  const bad=S.food<20||S.clean<20||S.mood<20;
  S.health=cl(S.health+(bad?-5:4)*h);
  if(!S.over&&!sl&&(S.ice>=100||S.fire>=100||Math.abs(S.ice-S.fire)>60)){S.over=true;S.asleep=false;S.petCalm=0;sfx('alarm');S.mood=cl(S.mood-20);S.clean=cl(S.clean-20);say('魔力暴走了！摸頭安撫它')}
  const low=Math.min(S.food,S.clean,S.mood),avg=(S.food+S.clean+S.mood)/3;const pb=S.bond;S.bond=Math.max(0,Math.min(100,S.bond+(low>=30&&avg>=50?0.9:low>=20?0.3:-0.3)*h));if(Math.floor(S.bond/20)>Math.floor(pb/20)&&!catching&&!anim&&!sl&&mode==='pet')play('love',2,'和 Noa 更親近了');if(pb<50&&S.bond>=50&&!S.bondMet){S.bondMet=true;S.lastVisit=S.t;S.firstVisitAt=S.t+(1+Math.random()*3)*H}
  if(!sl){
   if(S.food<20&&S.mood<20){const before=S.neglect;S.neglect+=h;if(before<12&&S.neglect>=12)say('Noa 一直望著外面……');if(S.neglect>=24){S.phase='gone';S.runs++;save();return}}
   else S.neglect=Math.max(0,S.neglect-h*2);
   const due=S.firstVisitAt&&S.t>=S.firstVisitAt;const hr=hourOf(S.t);if(S.bond>=50&&!S.over&&!anim&&!catching&&(mode==='pet'||mode==='pomo')&&hr>=9&&hr<21&&(due||(Math.random()<h*(S.bond/100)*0.15&&S.t-S.lastVisit>DAY*0.5))){S.firstVisitAt=0;{const st=snap();S.lastVisit=S.t;S.missAfter=0;S.mood=100;statusOpen=false;gain(st);sfx('rinya')}play('rinya',5,'Rinya 來看 Noa 了！')}
  }
 }
}
function snap(){return{food:S.food,clean:S.clean,mood:S.mood,ice:S.ice,fire:S.fire}}
function gain(st){const ks=[['food','#ffb347'],['clean','#cdb98b'],['mood','#ff8fa3'],['ice','#6fb7ff'],['fire','#ff8a3d']];const L=[];for(const[k,c]of ks){const dd=Math.round(S[k]-st[k]);if(Math.abs(dd)>=1)L.push({k,s:(dd>0?'+':'')+dd,c})}L.forEach((f,i)=>{f.i=i;f.n=L.length;f.t0=performance.now()});floats=L}
try{muted=localStorage.getItem('noa-proto-v1-mute')==='1'}catch(e){}
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}try{if(AC&&AC.state==='suspended')AC.resume()}catch(e){}return AC}
const SFX={move:[[880,.035]],ok:[[660,.06],[990,.09,.06]],deny:[[150,.16,0,'sawtooth']],warn:[[520,.08],[520,.08,.12]],rinya:[[523,.12],[659,.12,.13],[784,.12,.26],[1047,.24,.39]],alarm:[[330,.1,0,'sawtooth'],[220,.16,.12,'sawtooth']],hatch:[[392,.1],[523,.1,.11],[659,.1,.22],[784,.28,.33]]};
function sfx(n){if(muted||catching||!AC||AC.state!=='running')return;try{const t=AC.currentTime;for(const[f,d,o=0,ty='square']of SFX[n]){const os=AC.createOscillator(),gn=AC.createGain();os.type=ty;os.frequency.value=f;gn.gain.setValueAtTime(.05,t+o);gn.gain.exponentialRampToValueAtTime(.0001,t+o+d);os.connect(gn).connect(AC.destination);os.start(t+o);os.stop(t+o+d+.03)}}catch(e){}}
function buzz(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
function say(m){toast={m,until:performance.now()+2600}}
function play(name,loops,msg,then){facing=LEFT.has(name)?'L':'R';anim={row:R[name],loops,n:4,left:loops*4,then};frame=0;ft=0;if(msg)say(msg)}
function act(){
 if(S.phase==='egg'){S.phase='hatching';play('hatch',1);return}
 if(S.phase==='gone'){const runs=S.runs,bond=S.bond;S=fresh();S.runs=runs;S.bond=Math.floor(bond/2);save();return}
 if(S.phase!=='live'||anim)return;
 const id=MENU[sel][0];
 if(S.over&&id!=='pet'){say('Noa 太激動了，先摸摸頭');return}
 if(S.asleep&&id!=='sleep'){sel=MENU.findIndex(m=>m[0]==='sleep');say('Noa 在睡覺，按 OK 叫醒');return}
 S.neglect=0;
 switch(id){
  case'feed':if(S.food>95){say('Noa 吃不下了');return}S.food=cl(S.food+40);S.clean=cl(S.clean-3);play('eat',2);break;
  case'pet':if(S.over){S.petCalm++;if(S.petCalm>=3){S.over=false;S.ice=30;S.fire=30;S.mood=cl(S.mood+10);play('love',2,'Noa 平靜下來了')}else play('pet',1,`再摸 ${3-S.petCalm} 次`)}else{const hi=S.mood>=80;S.mood=cl(S.mood+15);play('pet',2,'',hi?['love',2,'Noa 撒嬌了']:null)}break;
  case'ball':{const opts=PLAYS.filter(p=>p[0]!==lastPlay&&!(p[0]==='icesc'&&(S.ice<15||S.fire-(S.ice-15)>45))&&!(p[0]==='smoke'&&(S.fire<15||S.ice-(S.fire-15)>45)));const [nm,lp,lab]=opts[Math.floor(Math.random()*opts.length)];lastPlay=nm;
   if(nm==='icesc'){S.ice=Math.max(0,S.ice-15);S.mood=cl(S.mood+20)}else if(nm==='smoke'){S.fire=Math.max(0,S.fire-15);S.mood=cl(S.mood+20)}else{S.mood=cl(S.mood+25);S.food=cl(S.food-(nm==='fly'?8:5))}
   play(nm,lp,'Noa '+lab);break}
  case'bath':S.clean=100;play('bath',3,'洗得乾乾淨淨');break;
  case'ice':if(S.ice<15){say('冰魔力不夠');return}if(S.fire-Math.max(0,S.ice-40)>60&&!(breathWarn.id==='ice'&&performance.now()<breathWarn.until)){breathWarn={id:'ice',until:performance.now()+4000};say('冰火會失衡！再按一次確定');return}breathWarn={};S.ice=Math.max(0,S.ice-40);play('ice',1);break;
  case'fire':if(S.fire<15){say('火魔力不夠');return}if(S.ice-Math.max(0,S.fire-40)>60&&!(breathWarn.id==='fire'&&performance.now()<breathWarn.until)){breathWarn={id:'fire',until:performance.now()+4000};say('冰火會失衡！再按一次確定');return}breathWarn={};S.fire=Math.max(0,S.fire-40);S.clean=cl(S.clean-5);play('fire',1);break;
  case'more':mode='more';moreSel=0;break;
  case'sleep':if(S.asleep){S.manualSleep=false;S.asleep=false;if(night(S.t)){S.wakeUntil=S.t+H;S.mood=cl(S.mood-5);play('angry',1,'Noa 被吵醒，有點不高興')}else{say('Noa 醒來了');if(S.health>=40)play('stretch',1)}}else{S.manualSleep=true;S.sleepStart=S.t;S.asleep=true;S.wakeUntil=0;play('yawn',2,'晚安，Noa')}break;
 }
 save();
}
function baseRow(){
 if(S.phase==='egg')return{row:R.hatch,frames:[0,1],x:24};
 if(S.asleep)return{row:R.sleep};
 if(S.over)return{row:R.over};
 if(S.health<40)return{row:R.sick};
 if(S.food<30)return{row:R.hungry};
 if(S.mood<20)return{row:R.angry};
 if(S.bond>=50&&S.t-S.lastVisit>1.5*DAY)return{row:R.miss};
 if(S.missAfter>S.t||performance.now()<missReal)return{row:R.miss};
 if(idleMode==='crystal')return{row:R.miss};
 if(idleMode==='walk')return{row:walkDir<0?R.walkL:R.walk,walk:true};
 if(facing==='L')return idleMode==='blink'?{row:R.blinkL}:{row:R.idleL};
 return{row:R[idleMode]};
}
// drawing
// ---- cozy lair background (drawn once per time-of-day, cached) ----
const BG={};
function rnd(seed){let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647}
function period(t){const h=hourOf(t);return h>=7&&h<17?'day':h>=17&&h<19?'dusk':h>=5&&h<7?'dawn':'night'}
function buildBg(p){
 const c=document.createElement('canvas');c.width=240;c.height=320;const b=c.getContext('2d');
 const px=(x,y,w,h,col)=>{b.fillStyle=col;b.fillRect(x,y,w,h)};const r=rnd(7);
 const night=p==='night';
 // wall
 const wall=night?'#3a2f4a':'#6a5480',wall2=night?'#342a43':'#604c75',mort=night?'#2c2339':'#56436a';
 px(0,0,240,236,wall);
 for(let y=0;y<236;y+=12){const off=(y/12)%2?0:14;for(let x=-off;x<240;x+=28){px(x+1,y+1,26,10,r()<.35?wall2:wall);}px(0,y,240,1,mort)}
 for(let y=0;y<236;y+=12){const off=(y/12)%2?0:14;for(let x=-off;x<240;x+=28)px(x,y,1,12,mort)}
 // window (left)
 const sky={day:['#9fd4ff','#c8e8ff'],dusk:['#f39a7a','#ffcf8f'],dawn:['#b7a3e0','#ffd3c2'],night:['#1b2147','#28305e']}[p];
 const wx=16,wy=70,ww=62,wh=54;
 px(wx-4,wy-4,ww+8,wh+8,'#3b2a22');px(wx-2,wy-2,ww+4,wh+4,'#8a5a3c');
 for(let i=0;i<wh;i++)px(wx,wy+i,ww,1,i<wh/2?sky[0]:sky[1]);
 if(p==='day'){[[wx+8,wy+14],[wx+34,wy+30]].forEach(([x,y])=>{px(x,y,18,5,'#fff');px(x+4,y-3,9,3,'#fff');px(x+2,y+5,14,2,'#e6f3ff')})}
 if(p==='dusk'||p==='dawn'){px(wx+40,wy+30,10,10,'#ffe7a3');px(wx+38,wy+32,14,6,'#ffe7a3')}
 if(night){px(wx+42,wy+8,10,10,'#f6f0c8');px(wx+46,wy+8,6,6,'#28305e')}
 px(wx+ww/2-1,wy,2,wh,'#8a5a3c');px(wx,wy+wh/2-1,ww,2,'#8a5a3c');
 px(wx-6,wy+wh+2,ww+12,5,'#9c6a48');px(wx-6,wy+wh+7,ww+12,2,'#5e3d2c');
 // curtains
 for(let i=0;i<wh+6;i++){const sw=Math.max(2,9-Math.abs(i-(wh*0.55))/6|0);px(wx-8,wy-6+i,sw,1,'#e58aa8');px(wx+ww+8-sw,wy-6+i,sw,1,'#e58aa8')}
 px(wx-10,wy-8,ww+20,3,'#b9663f');
 // shelf (right) with crystals + little book
 const sx=166,sy=112;
 px(sx,sy,62,4,'#9c6a48');px(sx,sy+4,62,2,'#5e3d2c');px(sx+6,sy+6,3,6,'#5e3d2c');px(sx+53,sy+6,3,6,'#5e3d2c');
 const crys=(x,h,c1,c2)=>{for(let i=0;i<h;i++){const w=Math.min(i+1,Math.max(1,(h-i)>>1)+1);px(x-w+1,sy-h+i,w*2-1,1,i<h/3?c2:c1)}};
 crys(176,14,'#6fb7ff','#d9efff');crys(188,10,'#c58bff','#ead7ff');crys(214,13,'#ff8a3d','#ffd24a');

 for(let i=0;i<14;i++){const x=Math.floor(i*23+r()*10),base=Math.round(196+8*Math.sin(x/320*Math.PI*4)+4*Math.sin(x/320*Math.PI*10));const h=10+Math.floor(r()*10);
  for(let k=0;k<h;k++){const w=Math.max(1,Math.floor((k)/2));m.fillStyle='#1f1832';m.fillRect(x-w,base-h+k,w*2+1,1)}
  if(r()<.5){m.fillStyle='#bfe4ff';m.fillRect(x,base-h,1,2)}}
 // ground strip 240..262, 96-wide tile: frost on the left half, embers on the right
 const[gr,q]=mk(96,30);
 q.fillStyle='#4a3530';q.fillRect(0,0,96,30);q.fillStyle='#3a2a28';for(let i=0;i<12;i++)q.fillRect(Math.floor(r()*96),6+Math.floor(r()*22),3,2);
 for(let x=0;x<96;x++){const ice=x<48;q.fillStyle=ice?'#bfe4ff':'#7a4a3a';q.fillRect(x,0,1,2);q.fillStyle=ice?'#6fb7ff':'#ff8a3d';if(x%7===0)q.fillRect(x,2,2,1)}
 q.fillStyle='#ffd24a';q.fillRect(60,10,1,1);q.fillRect(80,16,1,1);q.fillStyle='#ffffff';q.fillRect(12,9,1,1);q.fillRect(30,15,1,1);
 GBG={sky,far,mid,gr};return GBG}
function drawScroll(c,off,y){const w=c.width;let x=-((Math.floor(off)%w+w)%w);for(;x<240;x+=w)g.drawImage(c,x,y)}
function loop(now){
 const dt=Math.min(now-last,1000);last=now;
 tick(dt*speed);
 if(mode==='game')gameStep(dt/1000);pomoCheck();
 ft+=dt;if(ft>=220){ft-=220;frameStep()}
 draw();requestAnimationFrame(loop);
}
let lastIdle='';
function idleAct(){const hr=hourOf(S.t),m=S.mood,P=[];const add=(n,w)=>{if(n!==lastIdle)P.push([n,w])};
 const okIce=S.ice>=20&&S.fire-(S.ice-5)<=45,okFire=S.fire>=20&&S.ice-(S.fire-5)<=45;
 if(mode==='pomo'){add('hoard',3);add('stretch',2);if(okIce)add('icesc',2);if(okFire)add('smoke',2);add('love',1)}
 else if(m>=70){add('chase',3);add('roll',3);add('ball',2);add('fly',2);add('hoard',2);add('love',2);if(okIce)add('icesc',1);if(okFire)add('smoke',1)}
 else if(m>=40){add('hoard',3);add('ball',2);add('stretch',2);if(okIce)add('icesc',1);if(okFire)add('smoke',1)}
 else{add('hoard',2);add('stretch',1)}
 if(hr>=7&&hr<10)add('stretch',3);
 const tot=P.reduce((a,b)=>a+b[1],0);if(!tot)return false;let r=Math.random()*tot,pick=P[0][0];for(const[n,w]of P){if((r-=w)<0){pick=n;break}}
 lastIdle=pick;if(pick==='icesc')S.ice=Math.max(0,S.ice-5);if(pick==='smoke')S.fire=Math.max(0,S.fire-5);
 play(pick,2,mode==='pomo'&&pick==='love'?'Noa 在幫你加油':'');return true}
function calm(){return S.phase==='live'&&!S.asleep&&!S.over&&S.health>=40&&S.food>=30&&S.mood>=20}
function frameStep(){frame++;
  if(anim){anim.left--;if(anim.left<=0){if(S.phase==='hatching'){S.phase='live';S.t=Date.now();S.born=S.t;S.lastVisit=S.t;save();anim=null;play('jump',2,'Noa 誕生了！')}else{if(anim.row===R.rinya){S.missAfter=S.t+0.6*H;missReal=performance.now()+8000;facing='R';idleMode='idle'}const nx=anim.then;anim=null;if(nx)play(nx[0],nx[1],nx[2])}}}
  else if(calm()&&(mode==='pet'||mode==='pomo')){idleT++;
   if(idleMode==='idle'&&idleT>18&&Math.random()<.12){const hr=hourOf(S.t),since=(S.t-S.lastVisit)/DAY;const pc=Math.min(.15,(hr>=18&&hr<23?.08:.03)+since*.03);const r=Math.random();const sleepy=(hr>=21&&hr<23)||night(S.t);if(S.ice>80&&S.ice>=S.fire){S.ice-=20;play('ice',1,'Noa 忍不住吐了一口冰息');idleT=0}else if(S.fire>80){S.fire-=20;S.clean=cl(S.clean-3);play('fire',1,'Noa 忍不住噴了一小口火');idleT=0}else if(sleepy&&Math.random()<.3){play('yawn',1);idleT=0}else if(Math.random()<(mode==='pomo'?.25:.3)&&idleAct()){idleT=0}else{idleMode=r<pc?'crystal':r<pc+.55?'blink':'walk';if(idleMode==='crystal')facing='R';idleT=0}}
   else if(idleMode==='crystal'&&idleT>=20){idleMode='idle';idleT=0}
   else if(idleMode==='blink'&&idleT>=4){idleMode='idle';idleT=0}
   else if(idleMode==='walk'){walkX+=walkDir*4;if(Math.abs(walkX)>20)walkDir*=-1;if(idleT>8&&Math.abs(walkX)<4){facing=walkDir<0?'L':'R';idleMode='idle';walkX=0;idleT=0}}}
}
// input
function up(){ac();buzz();if(mode==='more'){moreSel=(moreSel+MORE.length-1)%MORE.length;sfx('move');return}if(mode==='pomoSet'){pomoIdx=(pomoIdx+POMO.length-1)%POMO.length;sfx('move');return}if(mode==='game'){jump();return}if(mode==='pomo')return;if(S.phase==='live'&&!statusOpen){sel=(sel+MENU.length-1)%MENU.length;sfx('move')}}
function dn(){ac();buzz();if(mode==='more'){moreSel=(moreSel+1)%MORE.length;sfx('move');return}if(mode==='pomoSet'){pomoIdx=(pomoIdx+1)%POMO.length;sfx('move');return}if(mode==='game'){jump();return}if(mode==='pomo')return;if(S.phase==='live'&&!statusOpen){sel=(sel+1)%MENU.length;sfx('move')}}
let okT=0,okLong=false,okTimer;
let ringRaf=0;function ring(on){cancelAnimationFrame(ringRaf);const b=document.getElementById('bO');if(!on||S.phase!=='live'){b.style.setProperty('--p',0);return}const t0=performance.now();const f=()=>{const p=Math.min(1,(performance.now()-t0)/500);b.style.setProperty('--p',p);if(p<1)ringRaf=requestAnimationFrame(f)};f()}
function okDown(){ac();buzz();if(mode==='game'&&G&&!G.over)jump();ring(true);okT=performance.now();okLong=false;clearTimeout(okTimer);okTimer=setTimeout(()=>{okLong=true;ring(false);if(S.phase!=='live')return;buzz();
  if(mode==='pet'){statusOpen=!statusOpen;sfx('move')}
  else if(mode==='game'){if(G&&!G.over){G.over=true;sfx('deny')}}
  else if(mode==='pomo'){if(pomoConfirm>performance.now()){S.pomo=null;mode='pet';pomoConfirm=0;say('放棄了，下次再一起加油');sfx('deny');save()}else{pomoConfirm=performance.now()+3000;sfx('warn')}}
  else{mode='pet';sfx('move')}},500)}
function okUp(){clearTimeout(okTimer);ring(false);if(!okLong&&mode!=='pet'){if(mode==='more'){const id=MORE[moreSel][0];if(id==='pomo'){mode='pomoSet';sfx('move')}else if(id==='game')startGame();else{mode='pet';sfx('move')}}else if(mode==='pomoSet')startPomo();else if(mode==='game'&&G&&G.over)endGame();else if(mode==='pomo'){const l=Math.ceil((S.pomo.end-Date.now())/60e3);say('還剩 '+l+' 分鐘');sfx('move')}return}if(!okLong){if(statusOpen){statusOpen=false;sfx('move')}else{const a0=anim,t0=toast,s0=S,st=snap();act();if(S!==s0)sfx('ok');else if(anim!==a0){sfx(S.phase==='hatching'?'hatch':'ok');if(S.phase==='live')gain(st)}else if(toast!==t0)sfx(breathWarn.id&&performance.now()<breathWarn.until?'warn':'deny')}}}
const bU=document.getElementById('bU'),bD=document.getElementById('bD'),bO=document.getElementById('bO');
bU.addEventListener('click',up);bD.addEventListener('click',dn);
bO.addEventListener('pointerdown',e=>{e.preventDefault();bO.classList.add('on');okDown()});
bO.addEventListener('pointerup',()=>{bO.classList.remove('on');okUp()});
bO.addEventListener('pointerleave',()=>{if(bO.classList.contains('on')){bO.classList.remove('on');clearTimeout(okTimer);ring(false)}});
bO.addEventListener('pointercancel',()=>{bO.classList.remove('on');clearTimeout(okTimer);ring(false)});
bO.addEventListener('contextmenu',e=>e.preventDefault());
bO.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')e.preventDefault()});
let kDown=false;
const ownKey=e=>{const b=e.target.closest&&e.target.closest('button');return b&&b!==bO};
addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&ownKey(e))return;if(e.key==='ArrowUp'){e.preventDefault();up()}else if(e.key==='ArrowDown'){e.preventDefault();dn()}else if((e.key==='Enter'||e.key===' ')&&!kDown){e.preventDefault();kDown=true;okDown()}});
addEventListener('keyup',e=>{if((e.key==='Enter'||e.key===' ')&&kDown){kDown=false;okUp()}});
const muteB=document.getElementById('mute');function setMute(v){muted=v;muteB.textContent=v?'音效關閉':'音效開啟';muteB.setAttribute('aria-pressed',String(!v));try{localStorage.setItem('noa-proto-v1-mute',v?'1':'0')}catch(e){}}setMute(muted);muteB.addEventListener('click',()=>{ac();setMute(!muted);if(!muted)sfx('ok')});
const PVN=[['idle','待機'],['blink','眨眼'],['walk','走路'],['walkL','向左走'],['idleL','面朝左待機'],['blinkL','面朝左眨眼'],['sleep','睡覺'],['yawn','打哈欠'],['stretch','伸懶腰'],['eat','吃東西'],['jump','開心跳'],['angry','生氣'],['love','撒嬌'],['pet','摸頭'],['bath','洗澡'],['ice','藍色吐息'],['fire','噴火'],['ball','玩球'],['chase','追光點'],['hoard','囤寶物'],['roll','打滾'],['fly','練習飛行'],['icesc','冰雕'],['smoke','吐煙圈'],['hungry','肚子餓'],['sick','生病'],['over','魔力暴走'],['miss','抱水晶'],['rinya','Rinya 來訪'],['hatch','孵化'],['note','離家字條']];
const pv=document.getElementById('pv');pv.innerHTML=PVN.map(([k,n])=>`<option value="${k}">${n}</option>`).join('');
document.getElementById('pvb').addEventListener('click',()=>{if(S.phase!=='live'||mode!=='pet'){say('孵化後、在主畫面才能預覽');return}ac();play(pv.value,2,'預覽：'+pv.options[pv.selectedIndex].text)});
const spd=document.getElementById('spd');
function setSpd(v){speed=v;try{localStorage.setItem(KEY+'-spd',v)}catch(e){}for(const b of spd.children)b.setAttribute('aria-pressed',String(+b.dataset.s===v))}
spd.addEventListener('click',e=>{const b=e.target.closest('button');if(b)setSpd(+b.dataset.s)});{let v=60;try{v=+localStorage.getItem(KEY+'-spd')||60}catch(e){}setSpd([1,60,600].includes(v)?v:60)}
document.getElementById('rst').addEventListener('click',()=>{mode='pet';G=null;S=fresh();anim=null;statusOpen=false;sel=0;save()});
// catch up time passed while page was closed (real time)
if(S.phase==='live'){const gap=Date.now()-S.t;if(gap>0){catching=true;tick(Math.min(gap,7*DAY));catching=false}}else S.t=Date.now();

const stat=document.getElementById('stat');
function panel(){const live=S.phase==='live';const sinceV=(S.t-S.lastVisit)/H;
 const rows=[['飽足',S.food,'#ffb347'],['清潔',S.clean,'#cdb98b'],['心情',S.mood,'#ff8fa3'],['健康',S.health,'#8fd18f'],['冰魔力',S.ice,'#6fb7ff'],['火魔力',S.fire,'#ff8a3d'],['羈絆',S.bond,'#c58bff']];
 let h=rows.map(([n,v,c])=>`<tr><td>${n}</td><td><div class="b"><i style="width:${live?v:0}%;background:${c}"></i></div></td><td>${live?Math.round(v):'–'}</td></tr>`).join('');
 h+=`<tr><td>今天專心</td><td></td><td>${S.pomoDay===today()?S.pomoN:0} 次</td></tr><tr><td>小遊戲最高分</td><td></td><td>${S.best||0}</td></tr><tr><td>冷落時數</td><td></td><td>${live?S.neglect.toFixed(1)+' h':'–'}</td></tr><tr><td>Rinya 上次來訪</td><td></td><td>${live?(sinceV<1?'剛剛':Math.floor(sinceV)+' h 前'):'–'}</td></tr><tr><td>狀態</td><td></td><td>${!live?(S.phase==='gone'?'離家':'蛋'):S.over?'魔力暴走':S.asleep?'睡覺':S.health<40?'生病':S.food<30?'肚子餓':S.mood<20?'生氣':S.bond>=50&&S.t-S.lastVisit>1.5*DAY?'想念 Rinya':S.missAfter>S.t?'送走 Rinya':'清醒'}</td></tr>`;
 stat.innerHTML=h}
setInterval(panel,300);panel();
if(S.phase==='live'&&S.pomo){mode='pomo';}
setInterval(save,10000);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(loop));
}
</script></body></html>
