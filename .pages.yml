  - name: videoCaption
    label: 影片說明
    type: string
    description: 顯示在影片下方，可留空
  - name: body
    label: 內文
    type: text
    description: '建議先到「你的網域/editor.html」用寫作小幫手編輯再貼過來。空一行是新段落。格式：插圖用 ![說明](圖片網址)；影片直接貼 YouTube／Vimeo／Bilibili 網址成一段，或寫 ![說明](影片網址) 單獨放一段，要縮小寫 ![說明|小](圖片網址)（小／中／大）；**粗體**、*淺色*、~~刪除線~~、==螢光標記==、[文字](網址)；顏色字型大小用 {紅|文字}、{大|文字}、{楷體|文字}，可合併成
      {藍,大|文字}，顏色也能填 #ff6699；「## 」小標題、「> 」引言、「- 」清單、單獨一行 --- 是分隔符號'
  view:
    fields:
    - title
    - category
    - date
    - adult
    primary: title
    sort:
    - date
    - title
    - category
    search:
    - title
    - category
    - excerpt
    - body
    default:
      sort: date
      order: desc
  filename:
    template: '{id}.json'
    field: false
