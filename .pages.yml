# Pages CMS 後台設定（由 Claude 整理，欄位名稱和舊版相同）
# settings.content.merge：儲存時只更新表單上有的欄位，檔案裡其他內容會保留。
#   「網站設定」底下的幾頁其實都存在同一個 data/site.json，靠這個設定才不會互相蓋掉，請不要刪除。
settings:
  content:
    merge: true
media:
  input: images
  output: /images
content:
- name: g-story
  label: 故事
  type: group
  items:
  - name: chapters
    label: 故事章節
    description: 主線故事的每一章。
    type: collection
    path: content/chapters
    format: json
    filename:
      template: '{id}.json'
      field: false
    view:
      fields:
      - title
      - series
      - order
      - date
      - adult
      primary: title
      sort:
      - order
      - date
      - title
      - series
      search:
      - title
      - series
      - body
      default:
        sort: date
        order: desc
    fields:
    - name: title
      label: 章節標題
      type: string
      required: true
    - name: series
      label: 所屬系列
      type: reference
      description: 從已建立的系列裡選
      required: true
      options:
        collection: series
        value: '{fields.title}'
        label: '{fields.title}'
        search: fields.title
    - name: id
      label: 網址代號
      type: string
      description: 這一篇的網址會用到，建立後盡量不要改。只能用英文、數字和 -，例如 lg-3
      required: true
      pattern:
        regex: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        message: 只能用英文、數字、- 和 _，而且不能有空白
    - name: order
      label: 第幾章
      type: number
      description: 同一個系列裡的順序，數字小的排前面，例如第 3 章就填 3
    - name: date
      label: 發布日期
      type: date
    - name: body
      label: 內文
      type: text
      description: 建議用寫作小幫手寫（在網站上打開這一篇 → 右下角「編輯」→ 用小幫手編輯），寫好按「複製全部」再貼到這裡。空一行是新段落
    - name: characters
      label: 出場角色
      type: reference
      description: 從角色名單裡選，可以選很多個；打字可以搜尋
      options:
        collection: characters
        multiple: true
        value: '{fields.name}'
        label: '{fields.name}'
        search: fields.name,fields.role
    - name: adult
      label: 成人內容（18+）
      type: boolean
      description: 打開後，讀者要先確認年齡才能閱讀
    - name: imageUrl
      label: 封面圖網址
      type: string
      description: 選填。顯示在標題下方、內文之前。到上傳頁傳好圖片後，按「複製網址」貼到這裡
      pattern:
        regex: ^(|https?://\S+|/\S+)$
        message: 請貼上 https:// 開頭的圖片網址（前後不要有空白）
    - name: imageSize
      label: 封面圖顯示大小
      type: select
      options:
        values:
        - 自動
        - 小
        - 中
        - 大
    - name: caption
      label: 封面圖說明
      type: string
      description: 選填，顯示在封面圖下方
    - name: video
      label: 影片網址
      type: string
      description: 選填。貼上 YouTube（含 Shorts）、Vimeo 或 Bilibili 的網址，會嵌在內文上方
    - name: videoCaption
      label: 影片說明
      type: string
      description: 選填，顯示在影片下方
    - name: font
      label: 整篇字型
      type: select
      description: 不選就用網站預設
      options:
        values:
        - 預設
        - 明體
        - 黑體
        - 楷體
    - name: size
      label: 整篇字體大小
      type: select
      description: 不選就用網站預設
      options:
        values:
        - 預設
        - 小
        - 大
        - 特大
    - name: indent
      label: 段落縮排
      type: select
      description: 只影響這一篇。不選或選「跟隨網站設定」，就照「外觀」裡的整體設定
      options:
        values:
        - 跟隨網站設定
        - 不縮排
        - 每一行都縮排
        - 只有段落第一行縮排
  - name: side
    label: 角色故事
    description: 主線以外，以某個角色為主角的短篇與番外。
    type: collection
    path: content/side-stories
    format: json
    filename:
      template: '{id}.json'
      field: false
    view:
      fields:
      - title
      - character
      - date
      - adult
      primary: title
      sort:
      - date
      - title
      - character
      search:
      - title
      - character
      - body
      default:
        sort: date
        order: desc
    fields:
    - name: title
      label: 標題
      type: string
      required: true
    - name: character
      label: 主角
      type: reference
      description: 從角色名單裡選
      required: true
      options:
        collection: characters
        value: '{fields.name}'
        label: '{fields.name}'
        search: fields.name,fields.role
    - name: id
      label: 網址代號
      type: string
      description: 這一篇的網址會用到，建立後盡量不要改。只能用英文、數字和 -，例如 rin-story-2
      required: true
      pattern:
        regex: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        message: 只能用英文、數字、- 和 _，而且不能有空白
    - name: date
      label: 發布日期
      type: date
    - name: body
      label: 內文
      type: text
      description: 建議用寫作小幫手寫（在網站上打開這一篇 → 右下角「編輯」→ 用小幫手編輯），寫好按「複製全部」再貼到這裡。空一行是新段落
    - name: adult
      label: 成人內容（18+）
      type: boolean
      description: 打開後，讀者要先確認年齡才能閱讀
    - name: imageUrl
      label: 封面圖網址
      type: string
      description: 選填。顯示在標題下方、內文之前。到上傳頁傳好圖片後，按「複製網址」貼到這裡
      pattern:
        regex: ^(|https?://\S+|/\S+)$
        message: 請貼上 https:// 開頭的圖片網址（前後不要有空白）
    - name: imageSize
      label: 封面圖顯示大小
      type: select
      options:
        values:
        - 自動
        - 小
        - 中
        - 大
    - name: caption
      label: 封面圖說明
      type: string
      description: 選填，顯示在封面圖下方
    - name: video
      label: 影片網址
      type: string
      description: 選填。貼上 YouTube（含 Shorts）、Vimeo 或 Bilibili 的網址，會嵌在內文上方
    - name: videoCaption
      label: 影片說明
      type: string
      description: 選填，顯示在影片下方
    - name: font
      label: 整篇字型
      type: select
      description: 不選就用網站預設
      options:
        values:
        - 預設
        - 明體
        - 黑體
        - 楷體
    - name: size
      label: 整篇字體大小
      type: select
      description: 不選就用網站預設
      options:
        values:
        - 預設
        - 小
        - 大
        - 特大
    - name: indent
      label: 段落縮排
      type: select
      description: 只影響這一篇。不選或選「跟隨網站設定」，就照「外觀」裡的整體設定
      options:
        values:
        - 跟隨網站設定
        - 不縮排
        - 每一行都縮排
        - 只有段落第一行縮排
  - name: series
    label: 故事系列
    description: 一部作品就是一個系列。先建立系列，再到「故事章節」新增章節。
    type: collection
    path: content/series
    format: json
    filename:
      template: series-{year}{month}{day}{hour}{minute}{second}.json
      field: false
    view:
      fields:
      - title
      - genre
      - status
      - order
      primary: title
      sort:
      - order
      - title
      search:
      - title
      - genre
      - description
      default:
        sort: order
        order: asc
    fields:
    - name: title
      label: 系列名稱
      type: string
      description: 改名後，這個系列底下的章節要重新選一次「所屬系列」
      required: true
    - name: status
      label: 狀態
      type: select
      options:
        values:
        - 連載中
        - 已完結
        - 短篇集
        - 暫停中
    - name: genre
      label: 類型
      type: string
      description: 例如：奇幻、日常、戀愛。顯示在系列名稱上方
    - name: description
      label: 簡介
      type: text
    - name: coverUrl
      label: 封面圖網址
      type: string
      description: 到上傳頁傳好圖片後，按「複製網址」貼到這裡
      pattern:
        regex: ^(|https?://\S+|/\S+)$
        message: 請貼上 https:// 開頭的圖片網址（前後不要有空白）
    - name: coverSize
      label: 封面顯示大小
      type: select
      options:
        values:
        - 自動
        - 小
        - 中
        - 大
    - name: order
      label: 排序
      type: number
      description: 故事頁的排列順序，數字小的排前面
- name: g-world
  label: 角色與世界觀
  type: group
  items:
  - name: characters
    label: 角色
    description: 登場人物。其他地方的「出場角色」「主角」都是從這裡選。
    type: collection
    path: content/characters
    format: json
    filename:
      template: char-{year}{month}{day}{hour}{minute}{second}.json
      field: false
    view:
      fields:
      - name
      - role
      - order
      primary: name
      sort:
      - order
      - name
      search:
      - name
      - role
      - summary
      - bio
      default:
        sort: order
        order: asc
    fields:
    - name: name
      label: 名字
      type: string
      description: 改名後，用到這個角色的故事、委託圖要重新選一次角色
      required: true
    - name: role
      label: 一句話身分
      type: string
      description: 例如：玄城家家主・大咒術師
    - name: avatarUrl
      label: 頭像網址
      type: string
      description: 到上傳頁傳好圖片後，按「複製網址」貼到這裡
      pattern:
        regex: ^(|https?://\S+|/\S+)$
        message: 請貼上 https:// 開頭的圖片網址（前後不要有空白）
    - name: avatarSize
      label: 頭像顯示大小
      type: select
      description: 角色個人頁上方的頭像大小
      options:
        values:
        - 自動
        - 小
        - 中
        - 大
    - name: summary
      label: 簡短介紹
      type: text
      description: 顯示在角色列表的卡片上，一兩句話就好
    - name: profile
      label: 基本資料
      type: object
      description: 例如 年齡／身高／生日，一列一項
      list:
        collapsible:
          collapsed: false
          summary: '{label}：{value}'
      fields:
      - name: label
        label: 項目
        type: string
        description: 例如：身高
      - name: value
        label: 內容
        type: string
        description: 例如：182 cm
    - name: bio
      label: 詳細介紹
      type: text
      description: 建議用寫作小幫手寫（在網站上打開這一篇 → 右下角「編輯」→ 用小幫手編輯），寫好按「複製全部」再貼到這裡。空一行是新段落
    - name: refs
      label: 設定圖
      type: object
      description: 角色的設定圖、參考圖，會顯示在角色頁的「設定圖」區塊
      list:
        collapsible:
          collapsed: false
          summary: 第 {index} 張　{caption}
      fields:
      - name: imageUrl
        label: 圖片網址
        type: string
        description: 到上傳頁傳好圖片後，按「複製網址」貼到這裡
        pattern:
          regex: ^(|https?://\S+|/\S+)$
          message: 請貼上 https:// 開頭的圖片網址（前後不要有空白）
      - name: caption
        label: 說明
        type: string
        description: 例如：正面設定、服裝細節
      - name: size
        label: 在列表中的大小
        type: select
        options:
          values:
          - 一般
          - 加大
    - name: order
      label: 排序
      type: number
      description: 角色頁的排列順序，數字小的排前面
  - name: glossary
    label: 名詞百科
    description: 故事裡的地名、組織、魔法等名詞。內文出現這些詞時會自動加上虛線，讀者點一下就能看說明。
    type: collection
    path: content/glossary
    format: json
    filename:
      template: term-{year}{month}{day}{hour}{minute}{second}.json
      field: false
    view:
      fields:
      - term
      - category
      - order
      primary: term
      sort:
      - order
      - term
      search:
      - term
      - aliases
      - short
      - body
      default:
        sort: order
        order: asc
    fields:
    - name: term
      label: 名詞
      type: string
      description: 例如地名、組織、魔法、種族的名字
      required: true
    - name: short
      label: 一句話說明
      type: text
      description: 讀者在內文點這個詞時跳出的說明，建議 60 字以內
    - name: category
      label: 分類
      type: string
      description: 例如：地名、組織、魔法、種族、物品。同分類的會放在一起
    - name: aliases
      label: 別名
      type: string
      description: 同一個東西的其他叫法，用頓號分開，例如：黑曜石城、黑城。這些詞也會被標示
    - name: body
      label: 詳細介紹
      type: text
      description: 選填。名詞頁的完整介紹，格式和故事內文一樣
    - name: imageUrl
      label: 圖片網址
      type: string
      description: 選填，會顯示在名詞頁
      pattern:
        regex: ^(|https?://\S+|/\S+)$
        message: 請貼上 https:// 開頭的圖片網址（前後不要有空白）
    - name: characters
      label: 相關角色
      type: reference
      description: 從角色名單裡選，可以選很多個；打字可以搜尋
      options:
        collection: characters
        multiple: true
        value: '{fields.name}'
        label: '{fields.name}'
        search: fields.name,fields.role
    - name: autolink
      label: 在內文自動標示
      type: boolean
      description: 很常見、到處都會出現的詞可以關掉，就只會出現在百科頁
      default: true
    - name: order
      label: 排序
      type: number
      description: 數字小的排前面；留空就照名稱排
- name: g-gallery
  label: 圖與工具
  type: group
  items:
  - name: commissions
    label: 委託圖
    description: 委託繪師畫的圖。有差分的話，全部放在同一筆裡。
    type: collection
    path: content/commissions
    format: json
    filename:
      template: comm-{year}{month}{day}{hour}{minute}{second}.json
      field: false
    view:
      fields:
      - title
      - artist
      - type
      - date
      - adult
      primary: title
      sort:
      - date
      - title
      - artist
      - type
      search:
      - title
      - artist
      - characters
      - description
      default:
        sort: date
        order: desc
    fields:
    - name: title
      label: 作品名稱
      type: string
      required: true
    - name: imageUrl
      label: 圖片網址（主圖）
      type: string
      description: 列表上顯示的那一張。到上傳頁傳好圖片後，按「複製網址」貼到這裡
      pattern:
        regex: ^(|https?://\S+|/\S+)$
        message: 請貼上 https:// 開頭的圖片網址（前後不要有空白）
    - name: artist
      label: 繪師
      type: string
      required: true
    - name: artistLink
      label: 繪師連結
      type: string
      description: 選填。繪師的主頁或社群網址，例如 https://x.com/…
    - name: date
      label: 完成日期
      type: date
    - name: type
      label: 類型
      type: select
      options:
        values:
        - 頭像
        - 半身
        - 全身
        - 雙人
        - 多人
        - 場景
        - Q版
        - 其他
    - name: characters
      label: 畫了哪些角色
      type: reference
      description: 從角色名單裡選，可以選很多個；打字可以搜尋
      options:
        collection: characters
        multiple: true
        value: '{fields.name}'
        label: '{fields.name}'
        search: fields.name,fields.role
    - name: description
      label: 說明
      type: text
      description: 選填，點開大圖時顯示
    - name: variantUrls
      label: 差分圖（一次貼上多張）
      type: text
      description: 一行一張圖片網址，會排在主圖後面，點開時可以左右滑。在上傳頁按「複製全部網址」就能整批貼上。要加說明就在網址後面寫「 | 說明」，例如 https://img.obsidianfirelight.com/xxx.png | 無背景版
    - name: variants
      label: 差分圖（逐張新增）
      type: object
      description: 想一張一張加、拖曳調整順序時用這裡；會排在上面整批貼上的差分前面
      list:
        collapsible:
          collapsed: false
          summary: 第 {index} 張　{caption}
      fields:
      - name: imageUrl
        label: 圖片網址
        type: string
        description: 到上傳頁傳好圖片後，按「複製網址」貼到這裡
        pattern:
          regex: ^(|https?://\S+|/\S+)$
          message: 請貼上 https:// 開頭的圖片網址（前後不要有空白）
      - name: caption
        label: 說明
        type: string
        description: 例如：無背景版、閉眼差分，可留空
    - name: adult
      label: 成人內容（18+）
      type: boolean
      description: 打開後，圖片會先霧化，讀者確認年齡後才看得到
    - name: imageSize
      label: 在列表中的大小
      type: select
      description: 加大會佔兩格寬
      options:
        values:
        - 一般
        - 加大
  - name: tools
    label: 小工具
    description: 自己做的小工具的介紹頁。
    type: collection
    path: content/tools
    format: json
    filename:
      template: '{id}.json'
      field: false
    view:
      fields:
      - title
      - status
      - order
      - date
      primary: title
      sort:
      - order
      - date
      - title
      search:
      - title
      - summary
      - body
      default:
        sort: order
        order: asc
    fields:
    - name: title
      label: 工具名稱
      type: string
      required: true
    - name: id
      label: 網址代號
      type: string
      description: 這一篇的網址會用到，建立後盡量不要改。只能用英文、數字和 -，例如 commission-log
      required: true
      pattern:
        regex: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        message: 只能用英文、數字、- 和 _，而且不能有空白
    - name: summary
      label: 一句話簡介
      type: text
      description: 顯示在小工具列表的卡片上
    - name: link
      label: 工具網址
      type: string
      description: 點「開啟工具」會打開這個網址，例如 https://…github.io/…
    - name: linkLabel
      label: 按鈕文字
      type: string
      description: 留空會顯示「開啟工具」
    - name: status
      label: 狀態
      type: select
      options:
        values:
        - 使用中
        - 開發中
        - 已停止
    - name: date
      label: 日期
      type: date
    - name: imageUrl
      label: 封面圖網址
      type: string
      description: 到上傳頁傳好圖片後，按「複製網址」貼到這裡
      pattern:
        regex: ^(|https?://\S+|/\S+)$
        message: 請貼上 https:// 開頭的圖片網址（前後不要有空白）
    - name: imageSize
      label: 封面圖顯示大小
      type: select
      options:
        values:
        - 自動
        - 小
        - 中
        - 大
    - name: body
      label: 介紹內文
      type: text
      description: 建議用寫作小幫手寫（在網站上打開這一篇 → 右下角「編輯」→ 用小幫手編輯），寫好按「複製全部」再貼到這裡。空一行是新段落
    - name: cardsTitle
      label: 教學圖卡標題
      type: string
      description: 顯示在圖卡上方，留空會顯示「使用教學」
    - name: cardUrls
      label: 教學圖卡（一次貼上多張）
      type: text
      description: 一行一張圖片網址，照順序排成可以左右滑的圖卡。在上傳頁按「複製全部網址」就能整批貼上。要加說明就在網址後面寫「 | 說明」
    - name: cards
      label: 教學圖卡（逐張新增）
      type: object
      description: 想一張一張加、拖曳調整順序時用這裡；會排在上面整批貼上的圖卡前面
      list:
        collapsible:
          collapsed: false
          summary: 第 {index} 張　{caption}
      fields:
      - name: imageUrl
        label: 圖片網址
        type: string
        description: 到上傳頁傳好圖片後，按「複製網址」貼到這裡
        pattern:
          regex: ^(|https?://\S+|/\S+)$
          message: 請貼上 https:// 開頭的圖片網址（前後不要有空白）
      - name: caption
        label: 說明
        type: string
        description: 顯示在這張圖卡下方，可留空
    - name: video
      label: 介紹影片網址
      type: string
      description: 選填。貼上 YouTube（含 Shorts）、Vimeo 或 Bilibili 的網址
    - name: videoCaption
      label: 影片說明
      type: string
      description: 選填，顯示在影片下方
    - name: order
      label: 排序
      type: number
      description: 小工具頁的排列順序，數字小的排前面
- name: notes
  label: 文章
  description: 創作心得、世界觀和角色的設定雜記。
  type: collection
  path: content/notes
  format: json
  filename:
    template: '{id}.json'
    field: false
  view:
    fields:
    - title
    - category
    - date
    - adult
    primary: title
    sort:
    - date
    - title
    - category
    search:
    - title
    - category
    - excerpt
    - body
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: 標題
    type: string
    required: true
  - name: category
    label: 分類
    type: select
    options:
      values:
      - 創作心得
      - 設定雜記
  - name: id
    label: 網址代號
    type: string
    description: 這一篇的網址會用到，建立後盡量不要改。只能用英文、數字和 -，例如 note-3
    required: true
    pattern:
      regex: ^[A-Za-z0-9][A-Za-z0-9_-]*$
      message: 只能用英文、數字、- 和 _，而且不能有空白
  - name: date
    label: 日期
    type: date
  - name: excerpt
    label: 摘要
    type: text
    description: 顯示在文章列表上，一兩句話就好
  - name: body
    label: 內文
    type: text
    description: 建議用寫作小幫手寫（在網站上打開這一篇 → 右下角「編輯」→ 用小幫手編輯），寫好按「複製全部」再貼到這裡。空一行是新段落
  - name: characters
    label: 相關角色
    type: reference
    description: 從角色名單裡選，可以選很多個；打字可以搜尋
    options:
      collection: characters
      multiple: true
      value: '{fields.name}'
      label: '{fields.name}'
      search: fields.name,fields.role
  - name: adult
    label: 成人內容（18+）
    type: boolean
    description: 打開後，讀者要先確認年齡才能閱讀
  - name: video
    label: 影片網址
    type: string
    description: 選填。貼上 YouTube（含 Shorts）、Vimeo 或 Bilibili 的網址，會嵌在內文上方
  - name: videoCaption
    label: 影片說明
    type: string
    description: 選填，顯示在影片下方
  - name: font
    label: 整篇字型
    type: select
    description: 不選就用網站預設
    options:
      values:
      - 預設
      - 明體
      - 黑體
      - 楷體
  - name: size
    label: 整篇字體大小
    type: select
    description: 不選就用網站預設
    options:
      values:
      - 預設
      - 小
      - 大
      - 特大
  - name: indent
    label: 段落縮排
    type: select
    description: 只影響這一篇。不選或選「跟隨網站設定」，就照「外觀」裡的整體設定
    options:
      values:
      - 跟隨網站設定
      - 不縮排
      - 每一行都縮排
      - 只有段落第一行縮排
- name: eggs
  label: 彩蛋
  description: 讓訪客探索的彩蛋。找到的紀錄只存在訪客自己的瀏覽器。頁尾最右邊的小符號是收藏冊的入口。
  type: file
  path: data/eggs.json
  format: json
  fields:
  - name: enabled
    label: 開啟彩蛋
    type: boolean
    description: 關掉後，所有彩蛋和收藏冊都會消失
    default: true
  - name: title
    label: 收藏冊名稱
    type: string
    description: 留空是「堡壘的秘密」
  - name: intro
    label: 收藏冊開頭的說明
    type: text
    description: 例如：這座堡壘藏著一些秘密，你找到了幾個呢？
  - name: entry
    label: 收藏冊入口要怎麼打開
    type: select
    description: 入口是頁尾最右邊的小符號
    options:
      values:
      - 點一下
      - 連點三下
  - name: entrySymbol
    label: 入口符號
    type: string
    description: 留空是 ✦，也可以換成其他符號或 emoji
  - name: toast
    label: 找到秘密時的提示
    type: string
    description: 可以用 {n} 和 {total}。留空是「🔮 發現了堡壘的秘密（{n} / {total}）」
  - name: allToast
    label: 全部找齊時的提示
    type: string
    description: 留空是「✨ 你找齊了堡壘的所有秘密！到收藏冊看看吧」
  - name: reward
    label: 找齊後的獎勵
    type: object
    description: 收藏冊全部找齊後，最下面會出現的內容。想讓獎勵只有拼出密語的人看得到，請用「加密後的獎勵」
    fields:
    - name: sealed
      label: 加密後的獎勵（密語封印）
      type: text
      description: '到寫作小幫手 › 說明 ›「加密彩蛋獎勵」產生後貼過來（egg1: 開頭的一長串）。有填這格時，訪客找齊後要輸入密語才看得到獎勵，下面的標題、圖片、內容都不會用到，請清空，因為 GitHub 上看得到它們'
    - name: sealTitle
      label: 封印的標題
      type: string
      description: 留空是「最後的封印」
    - name: askText
      label: 要輸入密語時的說明
      type: string
      description: 留空是「把收集到的線索拼成一句密語，就能打開最後的獎勵。」
    - name: wrongText
      label: 密語錯誤時的話
      type: string
      description: 留空是「封印沒有反應……再想想看」
    - name: title
      label: 標題（沒加密時用）
      type: string
      description: 留空是「給找齊秘密的你」
    - name: imageUrl
      label: 獎勵圖片網址（沒加密時用）
      type: string
      description: 選填。隱藏插圖之類的
      pattern:
        regex: ^(|https?://\S+|/\S+)$
        message: 請貼上 https:// 開頭的圖片網址（前後不要有空白）
    - name: text
      label: 內容（沒加密時用）
      type: text
      description: 可以寫一封信、一篇短篇。格式和故事內文一樣，可以用寫作小幫手寫好再貼過來
    - name: lockedText
      label: 還沒找齊時顯示的文字
      type: string
      description: 留空是「找齊所有秘密後，這裡會出現一份獎勵。」
  - name: scales
    label: ① 散落的龍鱗
    type: object
    description: 在指定的頁面藏一個閃閃發亮的小東西，點到就收集起來，全部找齊算一個秘密
    fields:
    - name: enabled
      label: 開啟
      type: boolean
      default: true
    - name: name
      label: 收集品的名字
      type: string
      description: 留空是「龍鱗」，也可以改成羽毛、星星碎片等等
    - name: iconUrl
      label: 收集品圖片網址
      type: string
      description: 選填。留空會用內建的藍色龍鱗圖案。建議用去背的 PNG
      pattern:
        regex: ^(|https?://\S+|/\S+)$
        message: 請貼上 https:// 開頭的圖片網址（前後不要有空白）
    - name: size
      label: 預設大小（像素）
      type: number
      description: 選填。每一片的預設大小，留空是 26（用自己的圖片時是 40）。越小越難找，建議 14～60
      options:
        min: 10
        max: 120
    - name: look
      label: 預設顯眼程度
      type: select
      description: 選填。每一片也可以另外設定
      options:
        values:
        - 正常（會發光）
        - 低調（不發光、半透明）
        - 幾乎隱形（滑過或靠近才看得到）
    - name: title
      label: 收藏冊裡的名稱
      type: string
      description: 留空是「散落的龍鱗」
    - name: bookTitle
      label: 圖鑑的標題
      type: string
      description: 留空是「諾雅的龍鱗圖鑑」這種「名稱＋圖鑑」的格式
    - name: clueTitle
      label: 線索區的標題
      type: string
      description: 留空是「收集到的線索」。只要有任何一片龍鱗填了線索，收藏冊就會出現線索區
    - name: hint
      label: 還沒找齊時的提示
      type: string
      description: 留空是「堡壘各處藏著閃閃發亮的龍鱗」
    - name: completeText
      label: 全部找齊時的話
      type: text
      description: 找齊時跳出來的台詞，也會顯示在收藏冊裡
    - name: speaker
      label: 說話的角色
      type: reference
      description: 選填。找齊時說話的角色
      options:
        collection: characters
        value: '{fields.name}'
        label: '{fields.name}'
        search: fields.name
    - name: items
      label: 藏在哪裡
      type: object
      description: 每一項是一片。這裡的順序就是收藏冊圖鑑裡的編號（No.1、No.2…），訪客可以照任何順序找
      list:
        collapsible:
          collapsed: false
          summary: '{page}　{spot}　{title}'
      fields:
      - name: page
        label: 藏在哪一頁
        type: string
        description: '打開那一頁，複製網址 # 後面的部分貼過來，例如 #read-lg-1、#commissions、#char-玄城凜夜。首頁填 #home'
        required: true
      - name: spot
        label: 放在頁面的哪裡
        type: select
        description: 留空是「頁面最下方」。「隨機」類的位置每次打開頁面都不一樣；「指定文字後面」和「內文第幾段後面」要再填下面對應的欄位。找不到內文或卡片的頁面會改放在最下方
        options:
          values:
          - 頁面最下方
          - 頁面最上方
          - 標題旁邊
          - 內文中間
          - 內文第幾段後面
          - 內文隨機一段
          - 指定文字後面
          - 隨機一張卡片裡
          - 頁尾那一行
          - 畫面角落（捲到最底才出現）
          - 完全隨機
      - name: after
        label: 指定文字
        type: string
        description: 選「指定文字後面」時填。龍鱗會藏在這頁第一個出現這段文字的地方後面，例如「月光」
      - name: para
        label: 第幾段
        type: number
        description: 選「內文第幾段後面」時填，例如 3。超過段數會放在最後一段
        options:
          min: 1
          max: 999
      - name: size
        label: 大小（像素）
        type: number
        description: 選填。留空就用上面的預設大小
        options:
          min: 10
          max: 120
      - name: look
        label: 顯眼程度
        type: select
        description: 選填。留空就用上面的預設
        options:
          values:
          - 正常（會發光）
          - 低調（不發光、半透明）
          - 幾乎隱形（滑過或靠近才看得到）
      - name: delay
        label: 停留幾秒後才出現
        type: number
        description: 選填。訪客要在這頁待滿幾秒，龍鱗才會冒出來。留空是馬上出現
        options:
          min: 0
          max: 300
      - name: flee
        label: 第一次點會逃走
        type: boolean
        description: 打勾的話，第一次點到它會溜到這頁的別的地方，要再找一次
        default: false
      - name: fleeText
        label: 逃走時的話
        type: string
        description: 選填。留空是「咦？它溜走了……」
      - name: clue
        label: 撿到時得到的線索
        type: text
        description: 選填。會列在收藏冊的線索區，用來拼出密語。建議寫成謎題，例如「第三章裡凜夜送的花」，不要直接寫出密語的字，因為 GitHub 上看得到
      - name: title
        label: 這片龍鱗的名字
        type: string
        description: 選填。顯示在收藏冊的圖鑑裡，例如「被月光照過的鱗片」。留空是「第 N 片龍鱗」
      - name: note
        label: 撿到時的一句話
        type: string
        description: 選填，例如「這片好像有點溫熱」。撿到時會跳出來，圖鑑裡也看得到
      - name: story
        label: 留下的內容
        type: text
        description: 選填。訪客在圖鑑點開這片龍鱗時看到的內容，可以是一段回憶、一封短信、一個小故事。格式和故事內文一樣，可以用寫作小幫手寫好再貼過來
      - name: imageUrl
        label: 留下的圖片網址
        type: string
        description: 選填。點開這片龍鱗時顯示的圖片
        pattern:
          regex: ^(|https?://\S+|/\S+)$
          message: 請貼上 https:// 開頭的圖片網址（前後不要有空白）
      - name: hint
        label: 還沒找到時的提示
        type: string
        description: 選填。圖鑑裡還沒找到的格子會顯示這句，例如「好像掉在某個故事的最後面」。留空是「還沒找到」
  - name: logo
    label: ② 戳 logo 的龍
    type: object
    description: 連點左上角的龍頭幾下會觸發
    fields:
    - name: enabled
      label: 開啟
      type: boolean
      default: true
    - name: title
      label: 收藏冊裡的名稱
      type: string
      description: 找到之後顯示的名稱，例如：打噴嚏的龍
    - name: hint
      label: 還沒找到時的提示
      type: string
      description: 收藏冊裡給還沒找到的人的線索，例如：左上角的龍，好像不太喜歡被戳
    - name: foundText
      label: 找到之後的說明
      type: text
      description: 找到後在收藏冊裡顯示的一段話
    - name: clicks
      label: 要連點幾下
      type: number
      description: 留空是 7 下
      options:
        min: 3
        max: 20
    - name: effect
      label: 效果
      type: select
      description: 留空是噴火
      options:
        values:
        - 噴火
        - 小龍飛過
    - name: dragonUrl
      label: 小龍圖片網址
      type: string
      description: 選填。選「小龍飛過」時飛過畫面的圖，留空會用 🐉
      pattern:
        regex: ^(|https?://\S+|/\S+)$
        message: 請貼上 https:// 開頭的圖片網址（前後不要有空白）
    - name: speaker
      label: 說話的角色
      type: reference
      description: 選填。選一個角色，會顯示他的頭像和名字
      options:
        collection: characters
        value: '{fields.name}'
        label: '{fields.name}'
        search: fields.name
    - name: lines
      label: 台詞
      type: text
      description: 一行一句，每次隨機說一句
  - name: idle
    label: ③ 偷看的角色
    type: object
    description: 在同一頁停著不動一段時間，角色會從右邊探出頭
    fields:
    - name: enabled
      label: 開啟
      type: boolean
      default: true
    - name: title
      label: 收藏冊裡的名稱
      type: string
      description: 找到之後顯示的名稱，例如：偷看的人
    - name: hint
      label: 還沒找到時的提示
      type: string
      description: 收藏冊裡給還沒找到的人的線索，例如：靜靜待在同一頁，好像會有人來看你
    - name: foundText
      label: 找到之後的說明
      type: text
      description: 找到後在收藏冊裡顯示的一段話
    - name: seconds
      label: 停多久會出現（秒）
      type: number
      description: 留空是 60 秒
      options:
        min: 15
        max: 600
    - name: speaker
      label: 說話的角色
      type: reference
      description: 選填。選一個角色，會顯示他的頭像和名字
      options:
        collection: characters
        value: '{fields.name}'
        label: '{fields.name}'
        search: fields.name
    - name: lines
      label: 台詞
      type: text
      description: 一行一句，每次隨機說一句
  - name: night
    label: ④ 深夜的堡壘
    type: object
    description: 在台灣時間深夜來訪，網站會變暗並點起燭光
    fields:
    - name: enabled
      label: 開啟
      type: boolean
      default: true
    - name: title
      label: 收藏冊裡的名稱
      type: string
      description: 找到之後顯示的名稱，例如：深夜的堡壘
    - name: hint
      label: 還沒找到時的提示
      type: string
      description: 收藏冊裡給還沒找到的人的線索，例如：夜深的時候，堡壘的燈火會改變
    - name: foundText
      label: 找到之後的說明
      type: text
      description: 找到後在收藏冊裡顯示的一段話
    - name: start
      label: 從幾點開始
      type: number
      description: 0～23，留空是 0 點
      options:
        min: 0
        max: 23
    - name: end
      label: 到幾點結束
      type: number
      description: 1～24，留空是 4 點（凌晨 0 點到 4 點）
      options:
        min: 1
        max: 24
    - name: speaker
      label: 說話的角色
      type: reference
      description: 選填。選一個角色，會顯示他的頭像和名字
      options:
        collection: characters
        value: '{fields.name}'
        label: '{fields.name}'
        search: fields.name
    - name: lines
      label: 台詞
      type: text
      description: 一行一句，每次隨機說一句
  - name: birthday
    label: ⑤ 角色生日
    type: object
    description: 在角色生日那天來訪，首頁和角色頁會出現生日橫幅和紙花
    fields:
    - name: enabled
      label: 開啟
      type: boolean
      default: true
    - name: title
      label: 收藏冊裡的名稱
      type: string
      description: 找到之後顯示的名稱，例如：特別的日子
    - name: hint
      label: 還沒找到時的提示
      type: string
      description: 收藏冊裡給還沒找到的人的線索，例如：在某個人特別的日子來訪
    - name: foundText
      label: 找到之後的說明
      type: text
      description: 找到後在收藏冊裡顯示的一段話
    - name: list
      label: 生日
      type: object
      list:
        collapsible:
          collapsed: false
          summary: '{character}　{month} 月 {day} 日'
      fields:
      - name: character
        label: 角色
        type: reference
        required: true
        options:
          collection: characters
          value: '{fields.name}'
          label: '{fields.name}'
          search: fields.name
      - name: month
        label: 月
        type: number
        required: true
        options:
          min: 1
          max: 12
      - name: day
        label: 日
        type: number
        required: true
        options:
          min: 1
          max: 31
      - name: message
        label: 生日那天的話
        type: text
        description: 選填，顯示在生日橫幅上
- name: g-site
  label: 網站設定
  type: group
  items:
  - name: site
    label: 首頁與基本資料
    description: 網站名稱和首頁上方的內容。
    type: file
    path: data/site.json
    format: json
    fields:
    - name: siteName
      label: 網站名稱
      type: string
      required: true
    - name: author
      label: 作者名稱
      type: string
      description: 顯示在頁尾
    - name: heroEyebrow
      label: 首頁小標
      type: string
      description: 大標題上方的一行小字
    - name: heroTitle
      label: 首頁大標題
      type: string
    - name: heroText
      label: 首頁介紹文字
      type: text
    - name: heroImageUrl
      label: 首頁主圖網址
      type: string
      description: 到上傳頁傳好圖片後，按「複製網址」貼到這裡
      pattern:
        regex: ^(|https?://\S+|/\S+)$
        message: 請貼上 https:// 開頭的圖片網址（前後不要有空白）
    - name: heroImageSize
      label: 首頁主圖顯示大小
      type: select
      description: 小：圖片佔比較少、文字比較多；大：圖片佔比較多
      options:
        values:
        - 自動
        - 小
        - 中
        - 大
    - name: heroFit
      label: 主圖顯示方式
      type: select
      description: 裁切填滿：圖片填滿框框，邊緣可能被切掉；完整顯示：整張圖都看得到
      options:
        values:
        - 裁切填滿
        - 完整顯示
    - name: heroSlides
      label: 首頁輪播圖片
      type: text
      description: '一行一張圖片網址，會接在主圖後面輪流播放；只有一張就不會輪播。網址後面可以加「 | 說明」或「 | 連結」，例如 https://img.obsidianfirelight.com/a.png | 大咒術師與小龍妻 | #stories'
    - name: heroInterval
      label: 輪播秒數
      type: number
      description: 每張停留幾秒，2～60，留空是 5 秒
      options:
        min: 2
        max: 60
    - name: heroEffect
      label: 輪播效果
      type: select
      options:
        values:
        - 淡入淡出
        - 左右滑動
    - name: heroOrder
      label: 輪播順序
      type: select
      options:
        values:
        - 依順序
        - 隨機
  - name: site-about
    label: 關於頁與頁尾
    description: 「關於」頁的內容、聯絡方式和每一頁最下面的文字。
    type: file
    path: data/site.json
    format: json
    fields:
    - name: about
      label: 關於頁內容
      type: text
      description: 建議用寫作小幫手寫（在網站上打開「關於」頁 → 右下角「編輯」→ 用小幫手編輯），寫好按「複製全部」再貼到這裡。空一行是新段落
    - name: contact
      label: 聯絡方式
      type: string
      description: 可以直接貼網址，或寫 [顯示文字](網址)
    - name: footer
      label: 頁尾文字
      type: string
      description: 例如：文字與圖像未經同意請勿轉載
  - name: site-theme
    label: 外觀
    description: 網站的配色、背景圖和段落縮排。只有這裡能改網站的顏色。
    type: file
    path: data/site.json
    format: json
    fields:
    - name: theme
      label: 外觀設定
      type: object
      fields:
      - name: defaultTheme
        label: 顯示模式
        type: select
        options:
          values:
          - 跟隨裝置
          - 固定淺色
          - 固定深色
      - name: accentColor
        label: 主題色（按鈕、連結）
        type: string
        description: '填色碼，例如 #3a4ea6；留空用預設。會自動調整到看得清楚的深淺'
        pattern:
          regex: ^(|#[0-9a-fA-F]{3}|#[0-9a-fA-F]{6})$
          message: '請填 # 開頭的色碼，例如 #3a4ea6'
      - name: indent
        label: 段落縮排
        type: select
        options:
          values:
          - 不縮排
          - 每一行都縮排
          - 只有段落第一行縮排
      - name: bgImageUrl
        label: 背景圖網址
        type: string
        description: 選填。整個網站的背景圖
        pattern:
          regex: ^(|https?://\S+|/\S+)$
          message: 請貼上 https:// 開頭的圖片網址（前後不要有空白）
      - name: bgFit
        label: 背景圖顯示方式
        type: select
        options:
          values:
          - 填滿畫面
          - 重複拼貼
      - name: bgOverlay
        label: 背景圖遮罩
        type: select
        description: 遮罩越濃，文字越清楚、背景圖越淡
        options:
          values:
          - 無
          - 淡
          - 中
          - 濃
      - name: lightBg
        label: 淺色模式・背景顏色
        type: string
        description: 填色碼，留空用預設
        pattern:
          regex: ^(|#[0-9a-fA-F]{3}|#[0-9a-fA-F]{6})$
          message: '請填 # 開頭的色碼，例如 #3a4ea6'
      - name: lightText
        label: 淺色模式・文字顏色
        type: string
        description: 填色碼，留空用預設
        pattern:
          regex: ^(|#[0-9a-fA-F]{3}|#[0-9a-fA-F]{6})$
          message: '請填 # 開頭的色碼，例如 #3a4ea6'
      - name: darkBg
        label: 深色模式・背景顏色
        type: string
        description: 填色碼，留空用預設
        pattern:
          regex: ^(|#[0-9a-fA-F]{3}|#[0-9a-fA-F]{6})$
          message: '請填 # 開頭的色碼，例如 #3a4ea6'
      - name: darkText
        label: 深色模式・文字顏色
        type: string
        description: 填色碼，留空用預設
        pattern:
          regex: ^(|#[0-9a-fA-F]{3}|#[0-9a-fA-F]{6})$
          message: '請填 # 開頭的色碼，例如 #3a4ea6'
  - name: site-safety
    label: 成人內容與圖片保護
    description: 18+ 內容的年齡確認，以及防止圖片被另存的設定。
    type: file
    path: data/site.json
    format: json
    fields:
    - name: adult
      label: 成人內容設定
      type: object
      fields:
      - name: notice
        label: 年齡確認的提醒文字
        type: text
        description: 留空會顯示預設的提醒
      - name: preview
        label: 鎖住時的圖片預覽
        type: select
        options:
          values:
          - 霧化預覽
          - 完全隱藏
      - name: passwordHash
        label: 密碼代碼
        type: string
        description: 選填。想加密碼的話，到寫作小幫手按「？」產生代碼再貼到這裡；留空就只要確認年齡
    - name: penalty
      label: 猜錯密碼的懲罰
      type: object
      description: 有設密碼時才會用到。次數和冷卻只記在讀者自己的瀏覽器，用途是好玩和降低亂猜，不是真正的防護
      fields:
      - name: enabled
        label: 開啟懲罰
        type: boolean
        default: false
      - name: speaker
        label: 說話的角色
        type: reference
        description: 選填。選一個角色，猜錯時會顯示他的頭像和名字
        options:
          collection: characters
          value: '{fields.name}'
          label: '{fields.name}'
          search: fields.name
      - name: lines
        label: 猜錯時的台詞
        type: text
        description: 一行一句，第 1 次猜錯說第 1 句、第 2 次說第 2 句……。可以用 {次數} 代表這是第幾次猜錯，也可以用 **粗體**、{紅|彩色字} 等格式。留空會用預設的三句
      - name: after
        label: 台詞用完之後
        type: select
        description: 猜錯次數超過台詞數量時怎麼辦。不選就是停在最後一句
        options:
          values:
          - 停在最後一句
          - 從頭輪流
          - 隨機
      - name: effect
        label: 猜錯時的效果
        type: select
        description: 每一次猜錯都會出現。結冰：輸入框結冰，要點 3 下敲碎才能再輸入。燃燒：輸入框燒起來 5 秒，燒完才能再輸入。搖晃：視窗抖一下（Android 手機還會震動）。結冰或燃燒（隨機）：每次二選一。每次隨機：從所有效果裡抽。不選就是搖晃
        options:
          values:
          - 結冰或燃燒（隨機）
          - 結冰
          - 燃燒
          - 搖晃
          - 搖晃＋結冰
          - 每次隨機
          - 無
      - name: cooldownAfter
        label: 連錯幾次開始冷卻
        type: number
        description: 留空是 3 次，填 0 就不冷卻
        options:
          min: 0
      - name: cooldownSeconds
        label: 第一次冷卻幾秒
        type: number
        description: 留空是 30 秒。之後每多錯一次，冷卻時間加倍，最長 5 分鐘
        options:
          min: 5
          max: 300
      - name: cooldownText
        label: 冷卻中顯示的文字
        type: string
        description: 可以用 {秒} 代表剩幾秒。留空會顯示「咒力回復中，{秒} 秒後才能再試」
      - name: successLine
        label: 猜對時的台詞
        type: string
        description: 選填。之前猜錯過、最後終於猜對時，畫面下方跳出的一句話，可以用 {次數}
    - name: protect
      label: 圖片保護
      type: object
      fields:
      - name: enabled
        label: 擋掉右鍵和長按另存圖片
        type: boolean
        default: true
      - name: hideOriginal
        label: 隱藏「開啟原圖」連結
        type: boolean
        default: true
      - name: watermark
        label: 浮水印文字
        type: string
        description: 例如網站名稱或你的帳號，會斜斜地鋪滿網站上的圖片；留空就不顯示
      - name: watermarkOpacity
        label: 浮水印濃度
        type: select
        options:
          values:
          - 淡
          - 中
          - 明顯
  - name: site-advanced
    label: 進階設定
    description: NEW 標記、名詞百科標示、縮圖。平常不太需要動。
    type: file
    path: data/site.json
    format: json
    fields:
    - name: newDays
      label: NEW 標記天數
      type: number
      description: 幾天內的新內容會加上「NEW」（讀者讀過就不再顯示）。留空是 14 天，填 0 就關閉
      options:
        min: 0
    - name: glossaryMode
      label: 名詞百科在內文的標示方式
      type: select
      description: 留空是「每篇第一次」
      options:
        values:
        - 每篇第一次
        - 全部標示
        - 關閉
    - name: useThumbs
      label: 列表使用縮圖
      type: boolean
      description: 打開後，委託圖、頭像、封面等列表會改用小縮圖，載入比較快。請先到上傳頁的「圖庫」按「產生縮圖」再打開
      default: false
    - name: showDemoBanner
      label: 顯示頂部「範例網站」提示
      type: boolean
  - name: history
    label: 網站歷程
    description: 首頁下方的時間軸，記錄網站的大事。
    type: collection
    path: content/history
    format: json
    filename:
      template: hist-{year}{month}{day}{hour}{minute}{second}.json
      field: false
    view:
      fields:
      - date
      - title
      primary: title
      sort:
      - date
      - title
      search:
      - title
      - description
      default:
        sort: date
        order: desc
    fields:
    - name: date
      label: 日期
      type: date
      required: true
    - name: title
      label: 標題
      type: string
      required: true
    - name: description
      label: 說明
      type: text
    - name: link
      label: 連結
      type: string
      description: '選填。可以填站內位置（例如 #read-lg-1）或 https:// 網址，標題會變成連結'
