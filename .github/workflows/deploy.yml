# 每次 push（包含在 Pages CMS 存檔）都會自動整理內容並發佈網站
# 分成兩個步驟：先整理並打包網站（build），再發佈（deploy）；發佈找不到檔案時會等一下再試一次
name: 整理內容並發佈網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 合併內容
        run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - name: 等打包好的網站準備好
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: 第一次失敗的話，等一分鐘
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry
        name: 再發佈一次
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
